# Default LOCAL development config. Set wankeycloak.localMode=N in cloud/production.
# Prefer database-driven WanKeycloakTenantConfig in production.
# Do not commit real client secrets.
wankeycloak.localMode=Y
wankeycloak.defaultTenantId=CLOUDCODE
wankeycloak.defaultRealm=wantok-saas
wankeycloak.defaultIssuer=http://localhost:8180/realms/wantok-saas
wankeycloak.defaultClientId=wantok-erp-web
wankeycloak.defaultClientSecretAlias=WANTOK_KEYCLOAK_CLIENT_SECRET_CLOUDCODE_WEB
wankeycloak.defaultOrganizationAlias=cloudcode
wankeycloak.defaultAuthServerUrl=http://localhost:8180
wankeycloak.defaultOrgPartyId=CLOUDCODE_PNG
wankeycloak.defaultClientSecret=CHANGE_ME_FROM_KEYCLOAK_CLIENT_CREDENTIALS
wankeycloak.defaultRedirectUri=http://localhost:8080/wankeycloak/control/oidcCallback
wankeycloak.defaultPostLoginPath=/partymgr/control/main
wankeycloak.defaultPostLogoutUri=http://localhost:8080/wankeycloak/control/loggedOut
wankeycloak.stateSecret=CHANGE_ME_TO_A_LONG_RANDOM_LOCAL_SECRET
wankeycloak.autoCreateUserLogin=Y
wankeycloak.autoSyncSecurityGroups=Y
